[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdd-md-acceleration"
version = "0.1.0"
description = "Parallel decoding distillation proof of concept for alanine dipeptide molecular dynamics"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.3,<3",
  "openmm>=8.1,<9",
  "ase>=3.23",
  "huggingface-hub>=0.25",
  "pyyaml>=6",
]

[project.optional-dependencies]
esen = ["fairchem-core>=2.0,<3"]
test = ["pytest>=8"]

[project.scripts]
pdd-md = "pdd_md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

